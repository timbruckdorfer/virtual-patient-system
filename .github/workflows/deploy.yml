name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west3
  SERVICE_NAME: virtual-patient-system
  ARTIFACT_REGISTRY: europe-west3-docker.pkg.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }}
      
      - name: Build Docker image
        run: |
          docker build -t ${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/virtual-patient/${{ env.SERVICE_NAME }}:${{ github.sha }} .
          docker tag ${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/virtual-patient/${{ env.SERVICE_NAME }}:${{ github.sha }} ${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/virtual-patient/${{ env.SERVICE_NAME }}:latest
      
      - name: Push Docker image to Artifact Registry
        run: |
          docker push ${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/virtual-patient/${{ env.SERVICE_NAME }}:${{ github.sha }}
          docker push ${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/virtual-patient/${{ env.SERVICE_NAME }}:latest
      
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/virtual-patient/${{ env.SERVICE_NAME }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --add-cloudsql-instances=${{ secrets.CLOUD_SQL_CONNECTION_NAME }} \
            --memory=1Gi \
            --cpu=1 \
            --timeout=300 \
            --max-instances=10 \
            --min-instances=0
      
      - name: Set environment variables
        run: |
          gcloud run services update ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --update-env-vars=ENVIRONMENT=production \
            --update-env-vars=CLOUD_SQL_CONNECTION_NAME=${{ secrets.CLOUD_SQL_CONNECTION_NAME }} \
            --update-env-vars=DB_USER=${{ secrets.DB_USER }} \
            --update-env-vars=DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            --update-env-vars=DB_NAME=${{ secrets.DB_NAME }} \
            --update-env-vars=OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
            --update-env-vars=OPENAI_MODEL=gpt-4o-mini \
            --update-env-vars=APP_SECRET_KEY=${{ secrets.APP_SECRET_KEY }} \
            --update-env-vars=REQUIRE_AUTH=false \
            --update-env-vars=OIDC_ISSUER=${{ secrets.OIDC_ISSUER }} \
            --update-env-vars=OIDC_CLIENT_ID=${{ secrets.OIDC_CLIENT_ID }} \
            --update-env-vars=OIDC_CLIENT_SECRET=${{ secrets.OIDC_CLIENT_SECRET }} \
            --update-env-vars=OIDC_AUTH_URL=${{ secrets.OIDC_AUTH_URL }} \
            --update-env-vars=OIDC_TOKEN_URL=${{ secrets.OIDC_TOKEN_URL }} \
            --update-env-vars=OIDC_JWKS_URL=${{ secrets.OIDC_JWKS_URL }} \
            --update-env-vars=OIDC_REDIRECT_URI=${{ secrets.OIDC_REDIRECT_URI }} \
            --update-env-vars=FRONTEND_URL=${{ secrets.FRONTEND_URL }} \
            --update-env-vars=VHB_PASSWORD=${{ secrets.VHB_PASSWORD }}
      
      - name: Output service URL
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region=${{ env.REGION }} --format='value(status.url)')
          echo "Service deployed to: $SERVICE_URL"
          echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_ENV

